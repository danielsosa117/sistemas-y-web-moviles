<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Reportes - Salsamentaría</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Encabezado con navegación funcional -->
    <header>
        <h1>Salsamentaría El Buen Sabor - Reportes</h1>
        <nav>
            <a href="index.html">Inicio</a>
            <a href="#">Productos</a>
            <a href="reportes.html">Reportes</a>
        </nav>
    </header>

    <div style="padding: 20px;">
        <!-- Filtro de fechas para reportes -->
        <section class="tabla-movimientos">
            <h2>Consulta de Movimientos por Fecha</h2>
            <form style="display: flex; gap: 15px; margin-bottom: 20px; align-items: center;">
                <label>Desde: <input type="date" style="padding: 8px; border-radius: 5px; border: 1px solid #ccc;"></label>
                <label>Hasta: <input type="date" style="padding: 8px; border-radius: 5px; border: 1px solid #ccc;"></label>
                <button type="button" style="background: #2c3e50; color: white; padding: 8px 15px; border: none; border-radius: 5px; cursor: pointer;">Buscar</button>
            </form>

            <table>
                <thead>
                    <tr>
                        <th>Fecha</th>
                        <th>Producto</th>
                        <th>Categoría</th>
                        <th>Tipo Movimiento</th>
                        <th>Cantidad</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>18/10/2026</td>
                        <td>Queso Mozzarella</td>
                        <td>Lácteos</td>
                        <td>Salida</td>
                        <td>6 kg</td>
                    </tr>
                    <tr>
                        <td>17/10/2026</td>
                        <td>Jamón Pietrán</td>
                        <td>Embutidos</td>
                        <td>Entrada</td>
                        <td>10 kg</td>
                    </tr>
                </tbody>
            </table>
        </section>
    </div>

</body>
</html>
