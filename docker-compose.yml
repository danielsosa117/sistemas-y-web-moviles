services:
  api:
    build: .
    environment:
      DATABASE_PATH: ${DATABASE_PATH:-/data/productos.db}
      AUTH_RECUPERACION_SIN_VERIFICACION: ${AUTH_RECUPERACION_SIN_VERIFICACION:-0}
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data
      - ./sql:/app/sql:ro
    restart: unless-stopped