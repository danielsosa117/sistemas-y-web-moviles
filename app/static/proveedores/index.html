<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Proveedores | Salsamentaria</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous">
    <link rel="stylesheet" href="/static/styles.css?v=14">
  </head>
  <body>
    <main class="container py-4 py-lg-5">
      <header class="page-heading mb-4">
        <div>
          <p class="eyebrow mb-2">Catálogos</p>
          <h1 class="display-6 fw-bold mb-2">Proveedores</h1>
          <p class="text-secondary mb-0">Mantén los datos de contacto de tus proveedores.</p>
        </div>
        <div class="api-indicator api-indicator-pending" id="api-indicator" role="status" aria-live="polite">
          <span class="api-indicator-dot" aria-hidden="true"></span><span>Conectando al API...</span>
        </div>
      </header>

      <div id="mensaje" class="alert d-none" role="alert"></div>
      <section class="section-heading mb-3">
        <div>
          <p class="eyebrow mb-1">Contactos</p>
          <h2 class="h4 mb-0">Listado de proveedores</h2>
        </div>
        <button id="abrir-formulario" type="button" class="btn btn-primary">Agregar proveedor</button>
      </section>

      <section class="card app-card">
        <div class="card-body border-bottom">
          <div class="row g-2 align-items-center">
            <div class="col-lg-8">
              <label for="buscar-proveedor" class="visually-hidden">Buscar proveedores</label>
              <input id="buscar-proveedor" type="search" class="form-control search-control" placeholder="Buscar por nombre, teléfono o correo...">
            </div>
            <div class="col-lg-4 text-lg-end">
              <span class="result-count" id="total-proveedores"></span>
            </div>
          </div>
        </div>
        <div class="card-body p-0">
          <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
              <thead class="table-light">
                <tr>
                  <th class="ps-3">ID</th><th>Nombre</th><th>Teléfono</th><th>Correo</th><th class="pe-3">Acciones</th>
                </tr>
              </thead>
              <tbody id="lista-proveedores">
                <tr><td colspan="5" class="text-center text-secondary py-4">Cargando proveedores...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </section>
    </main>

    <dialog id="dialogo-proveedor" class="dialogo-producto" aria-labelledby="titulo-formulario">
      <section class="card border-0 shadow-sm">
        <div class="card-body">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h2 class="h5 mb-0" id="titulo-formulario">Agregar proveedor</h2>
            <button id="cerrar-dialogo" type="button" class="btn-close" aria-label="Cerrar"></button>
          </div>
          <form id="formulario-proveedor">
            <div class="row g-3">
              <div class="col-12">
                <label for="nombre-proveedor" class="form-label">Nombre</label>
                <input id="nombre-proveedor" name="nombre" class="form-control" maxlength="100" required>
              </div>
              <div class="col-md-6">
                <label for="telefono-proveedor" class="form-label">Teléfono <span class="text-secondary">(opcional)</span></label>
                <input id="telefono-proveedor" name="telefono" type="tel" class="form-control" maxlength="30">
              </div>
              <div class="col-md-6">
                <label for="email-proveedor" class="form-label">Correo <span class="text-secondary">(opcional)</span></label>
                <input id="email-proveedor" name="email" type="email" class="form-control" maxlength="254">
              </div>
              <div class="col-12 d-flex gap-2">
                <button id="guardar-proveedor" type="submit" class="btn btn-primary">Guardar proveedor</button>
                <button id="cancelar-edicion" type="button" class="btn btn-outline-secondary d-none">Cancelar edición</button>
              </div>
            </div>
          </form>
        </div>
      </section>
    </dialog>

    <script src="/static/layout.js?v=1"></script>
    <script src="/static/auth.js?v=3"></script>
    <script src="/static/proveedores/proveedores.js?v=1"></script>
  </body>
</html>
