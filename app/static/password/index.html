<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cambiar contraseña | Salsamentaria</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous">
    <link rel="stylesheet" href="/static/styles.css?v=13">
  </head>
  <body>
    <main class="container py-5">
      <div class="row justify-content-center">
        <div class="col-12 col-md-7 col-lg-5 col-xl-4">
          <div class="text-center mb-4">
            <span class="brand-mark" aria-hidden="true">S</span>
            <h1 class="h3 fw-bold mt-3 mb-1">Cambia tu contraseña</h1>
            <p class="text-secondary mb-0">
              Usa una contraseña nueva que no hayas compartido con nadie.
            </p>
          </div>
          <div id="mensaje" class="alert d-none" role="alert"></div>
          <section class="card border-0 shadow-sm">
            <div class="card-body p-4">
              <form id="formulario-password">
                <div class="mb-3">
                  <label for="password-actual" class="form-label">Contraseña actual o temporal</label>
                  <input id="password-actual" name="password_actual" type="password"
                         class="form-control" autocomplete="current-password"
                         maxlength="128" required autofocus>
                </div>
                <div class="mb-3">
                  <label for="password-nueva" class="form-label">Nueva contraseña</label>
                  <input id="password-nueva" name="password_nueva" type="password"
                         class="form-control" autocomplete="new-password"
                         minlength="8" maxlength="128" required>
                </div>
                <div class="mb-4">
                  <label for="confirmar-password" class="form-label">Confirma la nueva contraseña</label>
                  <input id="confirmar-password" name="confirmar_password" type="password"
                         class="form-control" autocomplete="new-password"
                         minlength="8" maxlength="128" required>
                </div>
                <button id="boton-password" type="submit" class="btn btn-primary w-100">
                  Guardar contraseña
                </button>
              </form>
            </div>
          </section>
        </div>
      </div>
    </main>
    <script src="/static/auth.js?v=3"></script>
    <script src="/static/password/password.js?v=1"></script>
  </body>
</html>
