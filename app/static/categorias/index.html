<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Categorías | Salsamentaria</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous">
    <link rel="stylesheet" href="/static/styles.css?v=10">
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-inventory">
      <div class="container">
        <a class="navbar-brand fw-semibold d-flex align-items-center gap-2" href="/">
          <span class="brand-mark" aria-hidden="true">S</span><span>Salsamentaria</span>
        </a>
        <div class="navbar-nav flex-row ms-auto">
          <a class="nav-link" href="/productos-ui">Productos</a>
          <a class="nav-link" href="/movimientos-ui">Movimientos</a>
          <a class="nav-link active" aria-current="page" href="/categorias-ui">Categorías</a>
          <a class="nav-link" href="/proveedores-ui">Proveedores</a>
          <a class="nav-link" href="/usuarios-ui">Usuarios</a>
          <a class="nav-link" href="/roles-ui">Roles</a>
        </div>
      </div>
    </nav>

    <main class="container py-4 py-lg-5">
      <header class="page-heading mb-4">
        <div>
          <p class="eyebrow mb-2">Catálogos</p>
          <h1 class="display-6 fw-bold mb-2">Categorías</h1>
          <p class="text-secondary mb-0">Organiza los productos de tu inventario.</p>
        </div>
        <div class="api-indicator api-indicator-pending" id="api-indicator" role="status" aria-live="polite">
          <span class="api-indicator-dot" aria-hidden="true"></span><span>Conectando al API...</span>
        </div>
      </header>

      <div id="mensaje" class="alert d-none" role="alert"></div>
      <section class="section-heading mb-3">
        <div>
          <p class="eyebrow mb-1">Organización</p>
          <h2 class="h4 mb-0">Listado de categorías</h2>
        </div>
        <button id="abrir-formulario" type="button" class="btn btn-primary">Agregar categoría</button>
      </section>

      <section class="card app-card">
        <div class="card-body border-bottom">
          <div class="row g-2 align-items-center">
            <div class="col-lg-8">
              <label for="buscar-categoria" class="visually-hidden">Buscar categorías</label>
              <input id="buscar-categoria" type="search" class="form-control search-control" placeholder="Buscar categoría...">
            </div>
            <div class="col-lg-4 text-lg-end">
              <span class="result-count" id="total-categorias"></span>
            </div>
          </div>
        </div>
        <div class="card-body p-0">
          <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
              <thead class="table-light">
                <tr><th class="ps-3">ID</th><th>Nombre</th><th class="pe-3">Acciones</th></tr>
              </thead>
              <tbody id="lista-categorias">
                <tr><td colspan="3" class="text-center text-secondary py-4">Cargando categorías...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </section>
    </main>

    <dialog id="dialogo-categoria" class="dialogo-producto" aria-labelledby="titulo-formulario">
      <section class="card border-0 shadow-sm">
        <div class="card-body">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h2 class="h5 mb-0" id="titulo-formulario">Agregar categoría</h2>
            <button id="cerrar-dialogo" type="button" class="btn-close" aria-label="Cerrar"></button>
          </div>
          <form id="formulario-categoria">
            <label for="nombre-categoria" class="form-label">Nombre</label>
            <input id="nombre-categoria" name="nombre" class="form-control mb-3" maxlength="100" required>
            <div class="d-flex gap-2">
              <button id="guardar-categoria" type="submit" class="btn btn-primary">Guardar categoría</button>
              <button id="cancelar-edicion" type="button" class="btn btn-outline-secondary d-none">Cancelar edición</button>
            </div>
          </form>
        </div>
      </section>
    </dialog>

    <script src="/static/categorias/categorias.js?v=1"></script>
  </body>
</html>
