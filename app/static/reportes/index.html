<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reportes | Salsamentaria</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous">
    <link rel="stylesheet" href="/static/styles.css?v=14">
  </head>
  <body>
    <main class="container py-4 py-lg-5">
      <header class="page-heading mb-4">
        <div>
          <p class="eyebrow mb-2">Análisis</p>
          <h1 class="display-6 fw-bold mb-2">Reportes</h1>
          <p class="text-secondary mb-0">Consultas consolidadas del inventario y de los movimientos.</p>
        </div>
      </header>

      <div id="mensaje" class="alert d-none" role="alert"></div>

      <section class="card app-card">
        <div class="card-body border-bottom">
          <div class="row g-2 align-items-end">
            <div class="col-lg-4">
              <label for="reporte" class="form-label mb-1">Reporte</label>
              <select id="reporte" class="form-select">
                <option value="inventario-por-categoria">Inventario por categoría</option>
                <option value="stock-bajo">Productos con stock bajo</option>
                <option value="movimientos-por-proveedor">Movimientos por proveedor</option>
                <option value="movimientos-por-usuario">Movimientos por usuario</option>
              </select>
            </div>
            <div class="col-6 col-lg-2 filtro-fechas">
              <label for="desde" class="form-label mb-1">Desde</label>
              <input id="desde" type="date" class="form-control">
            </div>
            <div class="col-6 col-lg-2 filtro-fechas">
              <label for="hasta" class="form-label mb-1">Hasta</label>
              <input id="hasta" type="date" class="form-control">
            </div>
            <div class="col-12 col-lg d-flex gap-2">
              <button id="consultar" type="button" class="btn btn-primary">Consultar</button>
              <button id="descargar-csv" type="button" class="btn btn-outline-secondary" disabled>
                Descargar CSV
              </button>
            </div>
          </div>
          <p id="descripcion-reporte" class="text-secondary small mb-0 mt-3"></p>
        </div>
        <div class="card-body p-0">
          <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
              <thead class="table-light">
                <tr id="cabecera-reporte"></tr>
              </thead>
              <tbody id="cuerpo-reporte">
                <tr><td class="text-center text-secondary py-4">Cargando reporte...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
        <div class="card-footer bg-transparent">
          <span class="result-count" id="total-filas"></span>
        </div>
      </section>
    </main>

    <script src="/static/layout.js?v=1"></script>
    <script src="/static/auth.js?v=3"></script>
    <script src="/static/reportes/reportes.js?v=1"></script>
  </body>
</html>
