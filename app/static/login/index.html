<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Iniciar sesión | Salsamentaria</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous">
    <link rel="stylesheet" href="/static/styles.css?v=13">
  </head>
  <body>
    <main class="container py-5">
      <div class="row justify-content-center">
        <div class="col-12 col-md-7 col-lg-5 col-xl-4">
          <div class="text-center mb-4">
            <span class="brand-mark" aria-hidden="true">S</span>
            <h1 class="h3 fw-bold mt-3 mb-1">Salsamentaria</h1>
            <p class="text-secondary mb-0">Inicia sesión para continuar</p>
          </div>

          <div id="mensaje" class="alert d-none" role="alert"></div>

          <section class="card border-0 shadow-sm">
            <div class="card-body p-4">
              <form id="formulario-login" novalidate>
                <div class="mb-3">
                  <label for="email" class="form-label">Correo</label>
                  <input id="email" name="email" type="email" class="form-control"
                         autocomplete="username" maxlength="254" required autofocus>
                </div>
                <div class="mb-4">
                  <label for="password" class="form-label">Contraseña</label>
                  <input id="password" name="password" type="password" class="form-control"
                         autocomplete="current-password" maxlength="128" required>
                </div>
                <button id="boton-login" type="submit" class="btn btn-primary w-100">
                  Entrar
                </button>
                <div class="text-center mt-3">
                  <a href="/recuperar-password-ui">Olvidé mi contraseña</a>
                </div>
              </form>
            </div>
          </section>
        </div>
      </div>
    </main>

    <script src="/static/login/login.js?v=2"></script>
  </body>
</html>
