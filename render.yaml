services:
  - type: web
    name: catalogo-productos
    runtime: docker
    plan: free
    healthCheckPath: /salud
    envVars:
      - key: DATABASE_PATH
        value: /app/data/productos.db
      - key: CARGAR_DATOS_EJEMPLO
        value: "1"
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: VENDEDOR_PASSWORD
        sync: false
